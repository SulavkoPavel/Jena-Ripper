server:
  port: ${PORT:8082}

spring:
  servlet:
    multipart:
      max-file-size: ${JENA_MODEL_MAX_FILE_SIZE:10GB}
      max-request-size: ${JENA_MODEL_MAX_REQUEST_SIZE:10GB}

logging:
  file:
    name: ${JENA_LOG_FILE:${user.home}/.jena-ripper/logs/jena-ripper.log}

jena-ripper:
  dataset:
    type: ${JENA_DATASET_TYPE:tdb2}
    path: ${JENA_DATASET_PATH:${user.home}/.jena-ripper/data/dataset}
  rdf-source:
    type: ${JENA_SOURCE_TYPE:LOCAL_TDB2}
    cim-api:
      base-url: ${CIM_API_BASE_URL:}
      auth-base-url: ${CIM_API_AUTH_BASE_URL:}
      username: ${CIM_API_USERNAME:}
      password: ${CIM_API_PASSWORD:}
      model-id: ${CIM_API_MODEL_ID:}
      model-name: ${CIM_API_MODEL_NAME:}
      connect-timeout: ${CIM_API_CONNECT_TIMEOUT:5s}
      read-timeout: ${CIM_API_READ_TIMEOUT:30s}
      trust-untrusted-certificates: ${CIM_API_TRUST_UNTRUSTED_CERTIFICATES:true}
  graph:
    max-neighbors: ${JENA_MAX_NEIGHBORS:100}
  labels:
    predicates:
      - http://iec.ch/TC57/CIM100#IdentifiedObject.name
      - http://www.w3.org/2000/01/rdf-schema#label
      - http://www.w3.org/2004/02/skos/core#prefLabel
      - http://purl.org/dc/terms/title
      - http://xmlns.com/foaf/0.1/name
  api:
    allowed-origins: ${JENA_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
    search-limit: ${JENA_SEARCH_LIMIT:25}
  sparql:
    timeout: ${JENA_SPARQL_TIMEOUT:30s}
    max-select-rows: ${JENA_SPARQL_MAX_SELECT_ROWS:10000}
    max-graph-triples: ${JENA_SPARQL_MAX_GRAPH_TRIPLES:10000}
    speed-thresholds-ms: [100, 500, 2000, 10000]
  owner-rules:
    enabled: ${JENA_OWNER_RULES_ENABLED:true}
    jdbc-url: ${JENA_OWNER_RULES_JDBC_URL:jdbc:postgresql://localhost:5432/jena_ripper}
    username: ${JENA_OWNER_RULES_DB_USERNAME:}
    password: ${JENA_OWNER_RULES_DB_PASSWORD:}
    schema: ${JENA_OWNER_RULES_DB_SCHEMA:public}
    connect-timeout: ${JENA_OWNER_RULES_CONNECT_TIMEOUT:5s}
    pool-size: ${JENA_OWNER_RULES_POOL_SIZE:4}
  redis-rules:
    enabled: ${JENA_REDIS_RULES_ENABLED:true}
    host: ${JENA_REDIS_RULES_HOST:localhost}
    port: ${JENA_REDIS_RULES_PORT:6379}
    username: ${JENA_REDIS_RULES_USERNAME:}
    password: ${JENA_REDIS_RULES_PASSWORD:}
    database: ${JENA_REDIS_RULES_DATABASE:0}
    timeout: ${JENA_REDIS_RULES_TIMEOUT:5s}
    dataset-id: ${JENA_REDIS_RULES_DATASET_ID:2}
    model-type: ${JENA_REDIS_RULES_MODEL_TYPE:IM}
    diff-id: ${JENA_REDIS_RULES_DIFF_ID:}
    additional-dataset-ids: []
  settings:
    path: ${JENA_SETTINGS_PATH:}
